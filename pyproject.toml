[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gameboy-python"
version = "0.1.0.dev0"
description = "Readable, pure-Python Game Boy (DMG first) board built on sm83-python"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.23); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: System :: Emulators",
]
# A pinned revision of the CPU core, never a local path (docs/handoff-brief.md). It is a private
# repository: installing needs GitHub credentials. Develop against a local checkout with
# `pip install -e ../sm83-python` after installing this.
dependencies = [
    "sm83-python @ git+https://github.com/alewman/sm83-python.git@d846ce734b628933d68bfedc0dbcbe198db4dfa7",
    # The APU core, pinned the same way. It has no remote yet: the URL is this machine's checkout
    # until it gets one.
    "gb-apu-python @ git+file:///data/emu/gb-apu-python@f0a7f48b72dab9cf019cefc3968a09d0227fd189",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Pinned: `ruff format --check` must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[project.scripts]
gameboy-python = "gameboy_python.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gameboy_python"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gameboy_python"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["src", "."]
markers = [
    "slow: a test-ROM suite or oracle run; `pytest -m \"not slow\"` is the quick loop",
]
